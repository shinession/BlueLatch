<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>BlueLatch</title>
  <!--
    The BlueLatch icon: a diamond cut into two halves that a latch tongue snaps together,
    on a dark navy tile. The halves are one rounded diamond clipped along a seam of 6 units.
    Source of the PNG frames in assets/logo/png and of the icon embedded in the programs.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2b5c"/>
      <stop offset="1" stop-color="#090f26"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3aa0ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".13"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af0ff"/>
      <stop offset="1" stop-color="#38a2ff"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a92ff"/>
      <stop offset="1" stop-color="#2146d6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <rect id="gem" x="-65" y="-65" width="130" height="130" rx="26" transform="translate(128 128) rotate(45)"/>
    <clipPath id="L"><path d="M0 0H125V105.9L151 117.9V138.1L125 150.1V256H0Z"/></clipPath>
    <clipPath id="R"><path d="M256 0H131V102.1L157 114.1V141.9L131 153.9V256H256Z"/></clipPath>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#tile)"/>
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#glow)"/>
  <rect x="6" y="6" width="244" height="244" rx="58" fill="url(#gloss)"/>
  <rect x="7" y="7" width="242" height="242" rx="57" fill="none" stroke="#4a68b4" stroke-opacity=".55" stroke-width="2"/>
  <g filter="url(#shadow)">
    <use href="#gem" fill="url(#left)" clip-path="url(#L)"/>
    <use href="#gem" fill="url(#right)" clip-path="url(#R)"/>
  </g>
</svg>
